<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <meta name="description" content="IRS problems? Back taxes? Unfiled returns? Find out if your taxes are f*cked with our quick assessment.">

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Are Your Taxes F*cked?">
    <meta property="og:description" content="Quick assessment to see how f*cked your tax situation is.">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Content Container -->
    <div class="main-content">
        <!-- Hero Section -->
        <section class="hero">
            <div class="container">
                <h1>Are your taxes f*cked?</h1>
                <p class="hero-subtitle">Let's find out...</p>
            </div>
        </section>

        <!-- Quiz Section -->
        <section class="quiz-section">
        <div class="container">

            <!-- Progress Bar
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text"><span id="currentStep">1</span> of <span id="totalSteps">5</span></p>
            </div>  -->

            <!-- Quiz Container -->
            <div class="quiz-container" id="quizContainer">
                <!-- Questions will be injected here by JavaScript -->
            </div>

            <!-- Result Container (hidden initially) -->
            <div class="result-container" id="resultContainer" style="display: none;">
                <div class="result-verdict" id="resultVerdict"></div>
                <div class="result-message" id="resultMessage"></div>

                <!-- Contact Form -->
                <form id="contactForm" class="contact-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="details">Anything else we should know?</label>
                        <textarea id="details" name="details" rows="3" placeholder="Optional - any additional details that might help us help you"></textarea>
                    </div>

                    <button type="submit" class="submit-button">
                        <span class="button-text">UNF*CK YOUR TAXES</span>
                        <span class="button-loader" style="display: none;">Sending...</span>
                    </button>

                    <div class="form-feedback" style="display: none;"></div>
                </form>
            </div>

        </div>
    </section>
    </div>

    <!-- Footer -->
